name: locked-restore

on:
  push:
    branches: [ "main", "master" ]
  pull_request:

jobs:
  verify-lock:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore (locked mode)
        run: dotnet restore ClassroomToolkit.sln --locked-mode

      - name: Vulnerability Gate
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/quality/check-dependency-vulnerabilities.ps1 -Solution ClassroomToolkit.sln
          exit $LASTEXITCODE

      - name: Build
        run: dotnet build ClassroomToolkit.sln -c Debug --no-restore

      - name: Resolve Stable Profile
        id: stable_profile
        shell: pwsh
        run: |
          $profile = & pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/validation/resolve-stable-profile.ps1 `
            -Pipeline "locked-restore" `
            -EventName "${{ github.event_name }}"
          "profile=$profile" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Stable Test Profile
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/validation/run-stable-tests.ps1 `
            -Configuration Debug `
            -SkipBuild `
            -Profile "${{ steps.stable_profile.outputs.profile }}"

      - name: Core Contract Tests
        run: >-
          dotnet test tests/ClassroomToolkit.Tests/ClassroomToolkit.Tests.csproj
          -c Debug
          --no-build
          -m:1
          --filter "Gate=CoreContract"

      - name: Upload Stable Test Summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: locked-restore-stable-test-summary
          path: |
            artifacts/evidence/tests/current/stable-tests-summary.json
            artifacts/evidence/tests/current/stable-tests-entries
          if-no-files-found: warn
